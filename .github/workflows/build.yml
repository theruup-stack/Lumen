name: Bygg Lumen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bygg APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Döp om
        run: cp android/app/build/outputs/apk/release/app-release.apk Lumen-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Lumen-android.apk

  desktop:
    name: Dator (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Kopiera gränssnittet
        shell: bash
        run: cp -r shared/ui desktop/ui
      - name: Installera
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Bygg
        working-directory: desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
          if-no-files-found: error

  release:
    name: Publicera
    needs: [android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Lumen 1.0.${{ github.run_number }}
          body: |
            **Android:** ladda ner `Lumen-android.apk` på telefonen och öppna filen.
            **Windows:** `Lumen-win-x64.exe` · **Mac:** `Lumen-mac-universal.dmg` · **Linux:** `Lumen-linux-x86_64.AppImage`
          files: out/*
